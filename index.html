<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>草原津典 · 草地羔羊礼盒</title>
<style>
html,body{margin:0;min-height:100%;background:#f5f6f4;color:#173f32;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
b{font-size:22px;letter-spacing:.08em}p{color:#617067;font-size:16px}
</style>
</head>
<body>
<main><div><b>草原津典</b><p id="status">正在载入品牌页面…</p></div></main>
<script>
(async()=>{
  try{
    const files=["payload-00.txt","payload-01.txt","payload-02.txt","payload-03.txt","payload-04.txt"];
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    const bin=atob(parts.join(""));
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const html=new TextDecoder("utf-8").decode(bytes);
    document.open();document.write(html);document.close();
  }catch(error){
    document.getElementById("status").textContent="页面载入失败，请刷新后重试。";
    console.error(error);
  }
})();
</script>
</body>
</html>
